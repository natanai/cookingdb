name: One-time browser failure repair

on:
  push:
    branches: [refactor/unified-cooking-app]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, 'Trigger browser failure repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-cooking-app
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply guarded repairs found by browser tests
        run: node scripts/patch-browser-failures.mjs
      - name: Verify repaired source and static contracts
        run: |
          node --check docs/recipe.js
          npm run build
          npm test
      - name: Commit repaired browser regressions
        run: |
          if git diff --quiet -- docs/styles.css docs/recipe.js; then
            echo "::error::Browser repair made no source changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/styles.css docs/recipe.js
          git commit -m "Repair browser-discovered recipe and authoring regressions"
          git push origin HEAD:refactor/unified-cooking-app
