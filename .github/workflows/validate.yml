name: Validate repository

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Validate canonical recipe sources
        run: npm run validate
      - name: Build generated site data
        run: npm run build
      - name: Test the exact built candidate
        run: npm test
