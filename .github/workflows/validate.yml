name: Validate repository

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Audit CSV parser compatibility
        run: node scripts/audit-csv.mjs
      - name: Validate canonical recipe sources
        run: |
          set -o pipefail
          npm run validate 2>&1 | tee "$RUNNER_TEMP/validation.log"
      - name: Preserve validation failure details
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: ${{ runner.temp }}/validation.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build generated site data
        run: npm run build
      - name: Test the exact built candidate
        run: npm test

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build the exact browser candidate
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Run desktop Chromium and mobile WebKit journeys
        run: npm run test:browser
      - name: Build current main as the navigation baseline
        run: |
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach "$RUNNER_TEMP/cookingdb-main" FETCH_HEAD
          cd "$RUNNER_TEMP/cookingdb-main"
          npm ci
          npm run build
      - name: Compare navigation timing and post-reveal stability against main
        env:
          BASELINE_ROOT: ${{ runner.temp }}/cookingdb-main
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:navigation
      - name: Preserve browser review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-review-evidence
          path: |
            playwright-report
            test-results
            navigation-report
          if-no-files-found: ignore
          retention-days: 7
