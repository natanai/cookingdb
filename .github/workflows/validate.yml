name: Validate repository

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Audit CSV parser compatibility
        run: node scripts/audit-csv.mjs
      - name: Validate canonical recipe sources
        run: |
          set -o pipefail
          npm run validate 2>&1 | tee "$RUNNER_TEMP/validation.log"
      - name: Preserve validation failure details
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: ${{ runner.temp }}/validation.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build generated site data
        run: npm run build
      - name: Test the exact built candidate
        run: npm test
