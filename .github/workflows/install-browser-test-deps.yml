name: One-time browser test dependency install

on:
  push:
    branches: [refactor/unified-cooking-app]

permissions:
  contents: write

jobs:
  install:
    if: ${{ contains(github.event.head_commit.message, 'Install browser test dependency') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-cooking-app
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Playwright test runner
        run: |
          npm install --save-dev --save-exact @playwright/test@1.55.0
          npm pkg set 'scripts.test:browser=playwright test'
      - name: Verify dependency metadata
        run: npm ci
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Install pinned browser test dependency"
          git push origin HEAD:refactor/unified-cooking-app
