name: Apply unified refactor phase 2

on:
  push:
    branches:
      - refactor/unified-cooking-app

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-cooking-app
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/refactor-phase2.mjs
      - name: Commit deterministic migration
        run: |
          if git diff --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.js docs/recipe.js docs/planner.js
          git commit -m "Use shared recipe repository across pages"
          git push origin HEAD:refactor/unified-cooking-app
