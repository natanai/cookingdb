name: One-time legacy CSV repair

on:
  push:
    branches: [refactor/unified-cooking-app]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, 'Trigger one-time CSV repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-cooking-app
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Repair known malformed legacy CSV sources
        run: node scripts/repair-legacy-csv.mjs
      - name: Prove parser shape is clean
        run: node scripts/audit-csv.mjs
      - name: Commit repaired canonical sources
        run: |
          if git diff --quiet -- data/ingredient_catalog.csv recipes; then
            echo "::error::Repair script made no source changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ingredient_catalog.csv recipes/*/steps.csv
          git commit -m "Repair legacy CSV field boundaries"
          git push origin HEAD:refactor/unified-cooking-app
