name: Publish pending recipes

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate pending recipes without committing, deploying, or deleting inbox entries
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cookingdb-recipe-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      processed: ${{ steps.import.outputs.processed }}
      published_sha: ${{ steps.publish_commit.outputs.published_sha }}
    steps:
      - name: Require main for production publishing
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production publishing is only allowed from main. Use dry_run on review branches."
          exit 1

      - name: Check out the selected candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check publish secret
        env:
          COOKINGDB_ADMIN_TOKEN: ${{ secrets.COOKINGDB_ADMIN_TOKEN }}
        run: |
          if [ -z "$COOKINGDB_ADMIN_TOKEN" ]; then
            echo "::error::Missing repository secret COOKINGDB_ADMIN_TOKEN."
            exit 1
          fi

      - name: Verify versioned acknowledgement support
        env:
          COOKINGDB_INBOX_URL: ${{ vars.COOKINGDB_INBOX_URL || 'https://cookingdb-inbox.natanai.workers.dev' }}
        run: node scripts/publish-inbox.mjs preflight

      - name: Fetch pending recipes from the inbox
        env:
          COOKINGDB_ADMIN_TOKEN: ${{ secrets.COOKINGDB_ADMIN_TOKEN }}
          COOKINGDB_INBOX_URL: ${{ vars.COOKINGDB_INBOX_URL || 'https://cookingdb-inbox.natanai.workers.dev' }}
        run: |
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
            -X POST "${COOKINGDB_INBOX_URL%/}/admin/export" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: $COOKINGDB_ADMIN_TOKEN" \
            --data '{"status":"pending","include_payload":true}' \
            --output "$RUNNER_TEMP/cookingdb-inbox.json"

      - name: Materialize pending recipes in the isolated runner
        run: |
          # Even workflow dry-runs write into this disposable checkout so validation,
          # build, and tests exercise the proposed recipe files rather than stale main.
          node scripts/import-inbox.mjs \
            "$RUNNER_TEMP/cookingdb-inbox.json" \
            --report "$RUNNER_TEMP/cookingdb-import-report.json"

      - name: Read import report
        id: import
        env:
          WORKFLOW_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cookingdb-import-report.json', 'utf8'));
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `processed=${report.processed}\n`);
          fs.appendFileSync(output, `inbox_count=${report.inbox_ids.length}\n`);
          fs.appendFileSync(output, `created_count=${report.created_recipe_ids.length}\n`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Recipe inbox import',
              '',
              `Workflow dry run: **${process.env.WORKFLOW_DRY_RUN === 'true' ? 'yes' : 'no'}**`,
              `Processed: **${report.processed}**`,
              `New recipe directories in runner: **${report.created_recipe_ids.length}**`,
              `Already present and identical: **${report.already_present_recipe_ids.length}**`,
              '',
            ].join('\n')
          );
          NODE

      - name: Ensure every publishable inbox row can be acknowledged
        if: ${{ steps.import.outputs.processed != '0' }}
        run: |
          if [ "${{ steps.import.outputs.processed }}" != "${{ steps.import.outputs.inbox_count }}" ]; then
            echo "::error::At least one imported recipe is missing its numeric inbox ID. Nothing will be published or deleted."
            exit 1
          fi

      - name: Validate the exported row versions before publishing
        env:
          PUBLISHED_SHA: ${{ github.sha }}
        run: node scripts/publish-inbox.mjs receipt

      - name: Validate proposed recipe sources
        run: npm run validate

      - name: Build proposed site data
        run: npm run build

      - name: Test the exact built candidate
        run: npm test

      - name: Commit canonical recipe sources and built data
        id: publish_commit
        if: ${{ !inputs.dry_run && steps.import.outputs.processed != '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes data/ingredient_catalog.csv docs/built

          if git diff --cached --quiet; then
            echo "No new repository changes; imported recipes were already present and identical."
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish pending recipes"
            PUBLISHED_SHA="$(git rev-parse HEAD)"
            git push origin HEAD:main
            echo "published_sha=$PUBLISHED_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the exact commit and exported row versions
        if: ${{ !inputs.dry_run && steps.import.outputs.processed != '0' }}
        env:
          PUBLISHED_SHA: ${{ steps.publish_commit.outputs.published_sha }}
        run: node scripts/publish-inbox.mjs receipt

      - name: Preserve the publication receipt
        if: ${{ !inputs.dry_run && steps.import.outputs.processed != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipt
          path: ${{ runner.temp }}/publication-receipt.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: prepare
    if: ${{ !inputs.dry_run && needs.prepare.outputs.processed != '0' }}
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: ${{ needs.prepare.outputs.published_sha }}

  acknowledge:
    needs: [prepare, deploy]
    # Success is required even on an identical-import retry. Never infer deployment
    # from whether this run pushed a new commit.
    if: ${{ !inputs.dry_run && needs.prepare.outputs.processed != '0' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.published_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: publication-receipt
          path: ${{ runner.temp }}
      - name: Remove only the deployed row versions
        env:
          PUBLISHED_SHA: ${{ needs.prepare.outputs.published_sha }}
          COOKINGDB_ADMIN_TOKEN: ${{ secrets.COOKINGDB_ADMIN_TOKEN }}
          COOKINGDB_INBOX_URL: ${{ vars.COOKINGDB_INBOX_URL || 'https://cookingdb-inbox.natanai.workers.dev' }}
        run: node scripts/publish-inbox.mjs acknowledge
