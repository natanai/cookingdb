name: Publish pending recipes

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate pending recipes without committing, deploying, or deleting inbox entries
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: cookingdb-recipe-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check publish secret
        env:
          COOKINGDB_ADMIN_TOKEN: ${{ secrets.COOKINGDB_ADMIN_TOKEN }}
        run: |
          if [ -z "$COOKINGDB_ADMIN_TOKEN" ]; then
            echo "::error::Missing repository secret COOKINGDB_ADMIN_TOKEN."
            exit 1
          fi

      - name: Fetch pending recipes from the inbox
        env:
          COOKINGDB_ADMIN_TOKEN: ${{ secrets.COOKINGDB_ADMIN_TOKEN }}
          COOKINGDB_INBOX_URL: ${{ vars.COOKINGDB_INBOX_URL || 'https://cookingdb-inbox.natanai.workers.dev' }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "${COOKINGDB_INBOX_URL%/}/admin/export" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: $COOKINGDB_ADMIN_TOKEN" \
            --data '{"status":"pending","include_payload":true}' \
            --output "$RUNNER_TEMP/cookingdb-inbox.json"

      - name: Materialize pending recipes in the isolated runner
        run: |
          # Even workflow dry-runs write into this disposable checkout so validation,
          # build, and tests exercise the proposed recipe files rather than stale main.
          node scripts/import-inbox.mjs \
            "$RUNNER_TEMP/cookingdb-inbox.json" \
            --report "$RUNNER_TEMP/cookingdb-import-report.json"

      - name: Read import report
        id: import
        env:
          WORKFLOW_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cookingdb-import-report.json', 'utf8'));
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `processed=${report.processed}\n`);
          fs.appendFileSync(output, `inbox_count=${report.inbox_ids.length}\n`);
          fs.appendFileSync(output, `created_count=${report.created_recipe_ids.length}\n`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Recipe inbox import',
              '',
              `Workflow dry run: **${process.env.WORKFLOW_DRY_RUN === 'true' ? 'yes' : 'no'}**`,
              `Processed: **${report.processed}**`,
              `New recipe directories in runner: **${report.created_recipe_ids.length}**`,
              `Already present and identical: **${report.already_present_recipe_ids.length}**`,
              '',
            ].join('\n')
          );
          NODE

      - name: Ensure every publishable inbox row can be acknowledged
        if: ${{ steps.import.outputs.processed != '0' }}
        run: |
          if [ "${{ steps.import.outputs.processed }}" != "${{ steps.import.outputs.inbox_count }}" ]; then
            echo "::error::At least one imported recipe is missing its numeric inbox ID. Nothing will be published or deleted."
            exit 1
          fi

      - name: Validate proposed recipe sources
        run: npm run validate

      - name: Build proposed site data
        run: npm run build

      - name: Test the exact built candidate
        run: npm test

      - name: Commit canonical recipe sources and built data
        id: publish_commit
        if: ${{ !inputs.dry_run && steps.import.outputs.processed != '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes docs/built

          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "No new repository changes; imported recipes were already present and identical."
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish pending recipes"
            PUBLISHED_SHA="$(git rev-parse HEAD)"
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "published_sha=$PUBLISHED_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Pages to deploy the exact published commit
        if: ${{ !inputs.dry_run && steps.publish_commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.publish_commit.outputs.published_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module - <<'NODE'
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const base = `https://api.github.com/repos/${process.env.REPOSITORY}/actions/workflows/pages.yml/runs`;
          const params = new URLSearchParams({
            branch: 'main',
            event: 'push',
            head_sha: process.env.PUBLISHED_SHA,
            per_page: '10',
          });
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 90; attempt += 1) {
            const response = await fetch(`${base}?${params}`, { headers });
            if (!response.ok) {
              throw new Error(`Unable to inspect Pages deployment (${response.status}): ${await response.text()}`);
            }
            const data = await response.json();
            const run = data.workflow_runs?.find((candidate) => candidate.head_sha === process.env.PUBLISHED_SHA);

            if (!run) {
              console.log(`Waiting for Pages run for ${process.env.PUBLISHED_SHA.slice(0, 7)} (${attempt}/90)…`);
              await sleep(10000);
              continue;
            }

            console.log(`Pages run ${run.id}: ${run.status}${run.conclusion ? ` / ${run.conclusion}` : ''}`);
            if (run.status !== 'completed') {
              await sleep(10000);
              continue;
            }
            if (run.conclusion !== 'success') {
              throw new Error(`Pages did not successfully deploy the published commit (conclusion: ${run.conclusion || 'unknown'}). Inbox rows will be retained.`);
            }

            console.log(`Confirmed successful Pages deployment of ${process.env.PUBLISHED_SHA}.`);
            process.exit(0);
          }

          throw new Error('Timed out waiting for Pages to deploy the published commit. Inbox rows will be retained.');
          NODE

      - name: Remove only the published row versions from the inbox
        if: ${{ !inputs.dry_run && steps.import.outputs.processed != '0' }}
        env:
          COOKINGDB_ADMIN_TOKEN: ${{ secrets.COOKINGDB_ADMIN_TOKEN }}
          COOKINGDB_INBOX_URL: ${{ vars.COOKINGDB_INBOX_URL || 'https://cookingdb-inbox.natanai.workers.dev' }}
        run: |
          DELETE_PAYLOAD="$(node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cookingdb-import-report.json', 'utf8'));
          const exported = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cookingdb-inbox.json', 'utf8'));
          const sourceItems = Array.isArray(exported.items)
            ? exported.items
            : Array.isArray(exported.pending)
              ? exported.pending
              : [];
          const publishedIds = new Set(report.inbox_ids);
          const items = sourceItems
            .filter((item) => publishedIds.has(item.id))
            .map((item) => ({ id: item.id, updated_at: item.updated_at }));

          if (items.length !== publishedIds.size || items.some((item) => !item.updated_at)) {
            throw new Error('Unable to pair every published inbox row with its exported updated_at version. Cleanup stopped safely.');
          }
          process.stdout.write(JSON.stringify({ items }));
          NODE
          )"

          curl --fail-with-body --silent --show-error \
            -X POST "${COOKINGDB_INBOX_URL%/}/admin/delete-pending" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: $COOKINGDB_ADMIN_TOKEN" \
            --data "$DELETE_PAYLOAD" \
            --output "$RUNNER_TEMP/cookingdb-delete-result.json"

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cookingdb-delete-result.json', 'utf8'));
          if (!result.ok) throw new Error(result.error || 'Inbox cleanup failed');
          console.log(`Removed ${result.deleted ?? 'published'} exact-version pending inbox rows.`);
          NODE
